name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # create the release and upload binaries
  packages: write   # push the container image to ghcr.io

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build every platform
        run: make dist

      # Checksums, because the documented install is "curl one file and run
      # it". Anyone who wants to verify that download needs something to
      # verify it against.
      - name: Checksums
        run: cd dist && sha256sum shabadoo-* > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/shabadoo-*
            dist/SHA256SUMS
          generate_release_notes: true

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Version stamp
        id: v
        run: echo "version=$(git describe --tags --always)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          # arm64 matters here: the coordinator's natural home is a small
          # always-on box, and a lot of those are Raspberry Pis.
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
