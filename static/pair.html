<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>shabadoo — pair a device</title>
<style>
  :root {
    --bg: #080a0f; --panel: #10131c; --elev: #151926;
    --line: #222836; --line2: #2e3646;
    --fg: #e7eaf1; --dim: #808a9b; --faint: #545e6f;
    --accent: #5b9dff; --accent2: #8bb8ff; --accent-glow: rgba(91,157,255,.35);
    --ok: #4fd18b; --warn: #e6b850; --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    margin: 0 auto; max-width: 30rem; padding: 2rem 1.15rem;
    font: 14px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--fg);
    background:
      radial-gradient(900px 420px at 50% -240px, #12203a 0%, rgba(18,32,58,0) 70%),
      var(--bg);
    background-attachment: fixed;
  }
  h1 { font-size: 1.05rem; margin: 0 0 0.3rem; letter-spacing: .02em; }
  h1 .sub { color: var(--dim); font-weight: 400; font-size: 0.72rem; letter-spacing: .12em; text-transform: uppercase; }
  p { color: var(--dim); }
  .card {
    border: 1px solid var(--line2); border-radius: 9px; padding: 1.1rem;
    background: linear-gradient(180deg, var(--elev), var(--panel));
    box-shadow: 0 8px 26px rgba(0,0,0,.4);
  }
  label { display: block; color: var(--faint); font-size: 0.66rem;
          text-transform: uppercase; letter-spacing: .1em; margin: 0.9rem 0 0.3rem; }
  input {
    width: 100%; background: #0b0e15; color: var(--fg);
    border: 1px solid var(--line2); border-radius: 6px; padding: 0.6rem;
    font: inherit; letter-spacing: .08em;
  }
  input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  button {
    width: 100%; margin-top: 1.1rem; min-height: 46px;
    background: linear-gradient(180deg, var(--accent2), var(--accent));
    color: #05101f; border: 0; border-radius: 6px; font: inherit; font-weight: 700;
    cursor: pointer;
  }
  button:disabled { opacity: .4; cursor: default; }
  .msg { margin-top: 1rem; font-size: 0.85rem; }
  .msg.bad { color: var(--danger); }
  .msg.ok { color: var(--ok); }
  .token {
    margin-top: 0.8rem; padding: 0.7rem; border-radius: 6px;
    border: 1px dashed var(--line2); background: #0b0e15;
    word-break: break-all; font-size: 0.8rem; color: var(--accent2);
  }
  .warn { color: var(--warn); font-size: 0.78rem; margin-top: 0.7rem; }
  /* White plate behind the symbol: the page is dark, and a QR rendered onto a
     dark background is the classic "why won't it scan". */
  #qrwrap { margin-top: 1rem; text-align: center; }
  #qr { width: 190px; height: 190px; image-rendering: pixelated;
        background: #fff; padding: 6px; border-radius: 6px; }
  .qrhint { color: var(--faint); font-size: 0.72rem; margin: 0.5rem 0 0; }
</style>
</head>
<body>
<h1>shabadoo <span class="sub">pair a device</span></h1>
<p>Enter the pairing code from <code>shabadoo pair</code>. Codes are single-use
and expire after five minutes.</p>

<div class="card">
  <label for="code">Pairing code</label>
  <input id="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXXXXXX">
  <p id="named" class="msg" hidden></p>
  <div id="qrwrap" hidden>
    <img id="qr" alt="Scan this with the device you are pairing">
    <p class="qrhint">Scan with the device you are enrolling.</p>
  </div>
  <label for="label" id="labelrow">Name this device</label>
  <input id="label" autocomplete="off" placeholder="Alex's iPhone">
  <button id="go">Pair</button>
  <div class="msg" id="msg"></div>
  <div class="token" id="token" hidden></div>
</div>

<script>
// The code arrives in the fragment (#code=...) rather than the query string:
// a fragment is not sent to the server and does not land in access logs or in
// a Referer header. The page reads it locally and posts it to redeem.
const codeEl = document.getElementById("code");
const labelEl = document.getElementById("label");
const msg = document.getElementById("msg");
const tokenEl = document.getElementById("token");
const go = document.getElementById("go");

// location.hash is the RAW fragment in a browser, so URLSearchParams decodes
// each value exactly once and an encoded "&" inside a label stays inside it.
// Libraries that hand back an already-decoded fragment tear such a label apart;
// see the warning in docs/mobile-client.md before porting this logic.
const frag = new URLSearchParams(location.hash.slice(1));
const namedEl = document.getElementById("named");
const labelRow = document.getElementById("labelrow");

if (frag.get("code")) {
  codeEl.value = frag.get("code").toUpperCase();

  // A code minted with a name carries it. The operator chose that name and the
  // coordinator uses the one it recorded, so offering an editable field here
  // would collect something the server discards — worse than not offering it.
  const named = frag.get("label");
  if (named) {
    namedEl.textContent = "Pairing as “" + named + "”";
    namedEl.hidden = false;
    labelRow.hidden = true;
    labelEl.hidden = true;
    labelEl.value = named; // sent only as a suggestion; the server ignores it
  }

  // Show a QR of this very URL, so the page can be opened on a laptop and
  // scanned with the phone being enrolled — the common case when the code was
  // minted at a terminal. Built from location.href BEFORE the fragment is
  // stripped below, since the fragment is the part that matters.
  const qrWrap = document.getElementById("qrwrap");
  const qrImg = document.getElementById("qr");
  qrImg.src = "/pair/qr.svg?d=" + encodeURIComponent(location.href);
  qrImg.onload = () => { qrWrap.hidden = false; };
  // No QR is not an error worth showing: the code below it still works.
  qrImg.onerror = () => { qrWrap.hidden = true; };

  // Drop the fragment from the address bar so a screenshot or a shared URL
  // carries no usable credential.
  history.replaceState(null, "", location.pathname);
  (named ? go : labelEl).focus();
}

async function pair() {
  const code = codeEl.value.trim().toUpperCase();
  const label = labelEl.value.trim() || "unnamed device";
  if (!code) { msg.textContent = "enter a code"; msg.className = "msg bad"; return; }

  go.disabled = true;
  msg.textContent = "pairing…"; msg.className = "msg";
  try {
    const r = await fetch("/api/devices/redeem", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code, label }),
    });
    if (!r.ok) throw new Error((await r.text()).trim() || ("HTTP " + r.status));
    const out = await r.json();

    // The browser is already authenticated at this point: redeem set an
    // HttpOnly cookie, so the dashboard works on the next navigation and
    // survives reloads. This page cannot read that cookie back — that is the
    // point of HttpOnly — so it links onward rather than storing anything.
    //
    // The token is still shown because it is returned exactly once and is what
    // a CLI or app needs (`shabadoo pair --code` has its own path). Someone
    // pairing only this browser can ignore it.
    msg.innerHTML = 'paired — this browser is signed in. ' +
      '<a href="/">Open the dashboard →</a>';
    msg.className = "msg ok";
    tokenEl.hidden = false;
    tokenEl.textContent = out.token;
    codeEl.value = "";
  } catch (err) {
    msg.textContent = err.message;
    msg.className = "msg bad";
  } finally {
    go.disabled = false;
  }
}

go.addEventListener("click", pair);
for (const el of [codeEl, labelEl]) {
  el.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); pair(); } });
}
</script>
</body>
</html>
